name: Build Android Store APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-store-apk:
    name: Build Store APKs (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x kasir-android/gradlew

      - name: Decode Keystore
        env:
          POS_KEDAI_KEYSTORE_BASE64: ${{ secrets.POS_KEDAI_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$POS_KEDAI_KEYSTORE_BASE64" ]; then
            echo "$POS_KEDAI_KEYSTORE_BASE64" | base64 -d > ~/.android/poskedai.jks
          else
            echo "Keystore secret not set, release APK build will rely on debug build."
          fi

      - name: Build Store APK (Debug)
        run: cd kasir-android && ./gradlew :app-store:assembleDebug

      - name: Build Store APK (Release)
        env:
          POS_KEDAI_KEYSTORE: /home/runner/.android/poskedai.jks
          POS_KEDAI_KEYSTORE_PASSWORD: ${{ secrets.POS_KEDAI_KEYSTORE_PASSWORD }}
          POS_KEDAI_KEY_ALIAS: ${{ secrets.POS_KEDAI_KEY_ALIAS }}
          POS_KEDAI_KEY_PASSWORD: ${{ secrets.POS_KEDAI_KEY_PASSWORD }}
        run: cd kasir-android && ./gradlew :app-store:assembleRelease

      - name: Upload Store APKs Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-store-apks
          path: |
            kasir-android/app-store/build/outputs/apk/debug/*.apk
            kasir-android/app-store/build/outputs/apk/release/*.apk