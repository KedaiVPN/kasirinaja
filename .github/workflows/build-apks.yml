name: Build Android APKs (Store & Admin)

on:
  push:
    branches: [ main, "init-kasir-api-and-android-*" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-apks:
    name: Build APKs (Store & Admin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x kasir-android/gradlew

      - name: Decode Keystore
        env:
          POS_KEDAI_KEYSTORE_BASE64: ${{ secrets.POS_KEDAI_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$POS_KEDAI_KEYSTORE_BASE64" ]; then
            echo "$POS_KEDAI_KEYSTORE_BASE64" | base64 -d > ~/.android/poskedai.jks
          else
            echo "Keystore secret not set, release APK build will rely on default fallback or debug build."
          fi

      - name: Build Store APKs (Debug & Release)
        env:
          POS_KEDAI_KEYSTORE: /home/runner/.android/poskedai.jks
          POS_KEDAI_KEYSTORE_PASSWORD: ${{ secrets.POS_KEDAI_KEYSTORE_PASSWORD }}
          POS_KEDAI_KEY_ALIAS: ${{ secrets.POS_KEDAI_KEY_ALIAS }}
          POS_KEDAI_KEY_PASSWORD: ${{ secrets.POS_KEDAI_KEY_PASSWORD }}
        run: |
          cd kasir-android
          ./gradlew :app-store:assembleDebug :app-store:assembleRelease

      - name: Build Admin APKs (Debug & Release)
        env:
          POS_KEDAI_KEYSTORE: /home/runner/.android/poskedai.jks
          POS_KEDAI_KEYSTORE_PASSWORD: ${{ secrets.POS_KEDAI_KEYSTORE_PASSWORD }}
          POS_KEDAI_KEY_ALIAS: ${{ secrets.POS_KEDAI_KEY_ALIAS }}
          POS_KEDAI_KEY_PASSWORD: ${{ secrets.POS_KEDAI_KEY_PASSWORD }}
        run: |
          cd kasir-android
          ./gradlew :app-admin:assembleDebug :app-admin:assembleRelease

      - name: Upload Store APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-store-apks
          path: |
            kasir-android/app-store/build/outputs/apk/debug/*.apk
            kasir-android/app-store/build/outputs/apk/release/*.apk

      - name: Upload Admin APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-admin-apks
          path: |
            kasir-android/app-admin/build/outputs/apk/debug/*.apk
            kasir-android/app-admin/build/outputs/apk/release/*.apk
