spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  mail:
    host: localhost
    port: 3025

jwt:
  secret: Y2hhbmdlbWV0b3NvbWV0aGluZ3ZlcnlzZWNyZXRwbGVhc2VhbmR0aGFua3lvdQ==
  expiration: 86400000

app:
  upload:
    dir: uploads/test/
