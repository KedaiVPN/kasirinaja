server:
  port: 8080

spring:
  application:
    name: kasir-api
  datasource:
    url: jdbc:postgresql://localhost:5432/kasirinaja
    username: postgres
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:Y2hhbmdlbWV0b3NvbWV0aGluZ3ZlcnlzZWNyZXRwbGVhc2VhbmR0aGFua3lvdQ==}
  expiration: 86400000 # 24 hours

app:
  upload:
    dir: /www/wwwroot/kasir-api/uploads/products/